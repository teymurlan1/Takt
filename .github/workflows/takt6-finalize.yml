name: Finalize Takt 6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/takt6-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Takt 6 finalization
        run: python3 scripts/takt6-finalize.py
      - name: Run tests
        run: npm test
      - name: Syntax check
        run: npm run check
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public migrations package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Complete Takt 6 launch features"
          git push
