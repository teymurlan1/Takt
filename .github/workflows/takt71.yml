name: Apply Takt 7.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/takt71.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Apply Takt 7.1
        run: python3 scripts/takt71.py
      - name: Run tests
        run: npm test
      - name: Syntax check
        run: npm run check
      - name: Commit Takt 7.1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public test package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Takt 7.1: polish client cabinet, navigation and settings'
          git push
