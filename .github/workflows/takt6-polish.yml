name: Verify Takt 6 launch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/takt6-polish.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final UI polish
        run: python3 scripts/takt6-polish.py
      - name: Run all tests
        run: npm test
      - name: Syntax check
        run: npm run check
      - name: Commit verified polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-v2.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Polish Takt 6 launch UX"
          git push
