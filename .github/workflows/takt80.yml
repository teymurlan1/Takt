name: Apply Takt 8.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/takt80.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Apply backend
        run: python3 scripts/takt80_backend.py
      - name: Apply frontend
        run: python3 scripts/takt80_frontend.py
      - name: Finalize compatibility
        run: python3 scripts/takt80_finalize.py
      - name: Run tests
        run: npm test
      - name: Syntax check
        run: npm run check
      - name: Commit Takt 8.0
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public migrations test package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Takt 8.0: onboarding, localization, themes and booking flow'
          git push
