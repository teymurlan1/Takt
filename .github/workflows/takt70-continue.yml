name: Apply Takt 7.0 continuation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/takt70-continue.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Prepare patch helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/takt70.py')
          s=p.read_text()
          s=s.replace('worker=replace_once(worker,"bot-webhook-v61","bot-webhook-v70",\'webhook task\')','worker=worker.replace("bot-webhook-v61","bot-webhook-v70")')
          s=s.replace('worker=replace_once(worker,"bot-menu-v5","bot-menu-v70",\'menu task\')','worker=worker.replace("bot-menu-v5","bot-menu-v70")')
          p.write_text(s)
          PY
      - name: Apply Takt 7.0 continuation
        run: python3 scripts/takt70.py
      - name: Run tests
        run: npm test
      - name: Syntax check
        run: npm run check
      - name: Commit Takt 7.0
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public migrations test package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Takt 7.0: continue Work update'
          git push
