name: Apply Takt 6 booking Back navigation fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/takt6-back-nav.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply focused Back navigation patch
        run: node scripts/takt6-back-nav.mjs

      - name: Run tests
        run: npm test

      - name: Syntax check
        run: npm run check

      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-v2.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Continue Takt 6: preserve booking state on Back"
          git push

# retry after patch-script syntax fix
