name: Apply Takt 8.1

on:
  push:
    branches: [takt-8.1-work]
    paths:
      - '.github/workflows/takt81.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: takt-8.1-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Takt 8.1 app patch
        run: python3 scripts/takt81-app.py
      - name: Apply Takt 8.1 server patch
        run: python3 scripts/takt81-server.py
      - name: Apply Takt 8.1 fixes
        run: python3 scripts/takt81-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Verify 8.1 markers
        run: |
          node -e "if(require('./package.json').version!=='8.1.0')process.exit(1)"
          grep -q 'takt-v81.css' public/index.html
          grep -q "version:'8.1.0'" src/worker.js
          grep -q 'Переписка через Takt отключена' src/worker.js
          grep -q 'review-notice:' src/worker.js
      - name: Commit Takt 8.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-v2.js public/landing.js public/i18n.js public/takt-v81.css public/index.html src/v3.js src/v5.js src/worker.js src/delivery.js package.json package-lock.json test/v72.test.mjs test/v81.test.mjs
          git commit -m "Takt 8.1: refine UX, direct messaging, localization and admin"
          git push origin HEAD:takt-8.1-work
