name: Apply Takt 7.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/takt72.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Apply Takt 7.2
        run: python3 scripts/takt72.py
      - name: Align legacy test with requested early completion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/app.test.mjs')
          s=p.read_text()
          s=s.replace("test('only company can confirm; cannot complete future appointment'","test('only company can confirm and specialist may complete early'")
          s=s.replace("assert.equal((await t.request('/bookings/'+b.data.id,'PATCH',{status:'done'},'company')).status,400)","assert.equal((await t.request('/bookings/'+b.data.id,'PATCH',{status:'done'},'company')).status,200)")
          p.write_text(s)
          PY
      - name: Run tests
        run: npm test
      - name: Syntax check
        run: npm run check
      - name: Commit Takt 7.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public migrations test package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Takt 7.2: messaging, calendar and dashboard polish'
          git push
